version: '3.8'

services:
  gateway:
    build: ./public-gateway
    container_name: mcp-public-gateway
    restart: always
    ports:
      - "7435:7435"
    env_file:
      - .env
    # The COCKPIT_AUTH_URL default reaches Cockpit on the host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - /root/.ssh:/root/.ssh:ro
      - /home/bmericc/.ssh:/home/bmericc/.ssh:ro
    networks:
      - mcp-net

networks:
  mcp-net:
    driver: bridge
